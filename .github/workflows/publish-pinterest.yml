name: Publish approved Pinterest rows

on:
  workflow_dispatch:
  schedule:
    - cron: "47 22 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish approved rows only
        env:
          PINTEREST_PUBLISH_ENABLED: ${{ vars.PINTEREST_PUBLISH_ENABLED }}
          PINTEREST_ACCESS_TIER: ${{ vars.PINTEREST_ACCESS_TIER }}
          PINTEREST_APP_ID: ${{ vars.PINTEREST_APP_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python src/publish_pinterest.py
      - name: Save published IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/autopilot_queue.csv
          git diff --cached --quiet || git commit -m "chore: record published Pinterest IDs"
          git push
