name: SaaS affiliate autopilot

on:
  workflow_dispatch:
    inputs:
      command:
        description: Command
        type: choice
        options: [autopilot]
        default: autopilot
      dry_run:
        description: Preview without saving state
        type: boolean
        default: false
  schedule:
    - cron: "17 22 * * 1"

permissions:
  contents: write

concurrency:
  group: affiliate-autopilot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Run autopilot
        env:
          COMMAND: ${{ inputs.command || 'autopilot' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python src/autopilot.py --command "$COMMAND" --dry-run
          else
            python src/autopilot.py --command "$COMMAND"
          fi
      - name: Save generated queue and state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --cached --quiet || git commit -m "chore: run affiliate autopilot"
          git push
      - name: Upload bundle
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-autopilot-bundle
          path: generated/
          retention-days: 30
