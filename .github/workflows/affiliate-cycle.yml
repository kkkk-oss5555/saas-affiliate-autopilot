name: Build affiliate cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * *"

permissions:
  contents: write

concurrency:
  group: affiliate-cycle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Generate one cycle
        run: python src/pipeline.py
      - name: Save generated candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated index.html
          git diff --cached --quiet || git commit -m "chore: generate affiliate candidates"
          git push
      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-review-bundle
          path: generated/
          retention-days: 30
